name: Build All Tools

# Builds every tool in tools.list through the meta front ends, the way a user
# would after `make bootstrap`. The tools are git submodules: committed ones
# are checked out with the repository; if .gitmodules does not list them yet,
# `make bootstrap` adds them from the URLs in tools.list for this run.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (make)
            runner: ubuntu-latest
            front: make
          - name: Linux (cmake)
            runner: ubuntu-latest
            front: cmake
          - name: macOS (make)
            runner: macos-latest
            front: make
          - name: Windows MSYS2 (make)
            runner: windows-latest
            front: make
    defaults:
      run:
        shell: ${{ startsWith(matrix.runner, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison flex m4 libreadline-dev zip
      - name: Host packages (macOS)
        if: runner.os == 'macOS'
        # Apple's bison 2.3 is too old; Homebrew's is keg-only, so put it first on PATH.
        run: |
          brew install bison flex readline
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Host packages (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make zip unzip bison flex m4
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-readline mingw-w64-ucrt-x86_64-cmake

      - name: Fetch the tools if they are not submodules yet
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global --add safe.directory '*'
          make bootstrap
          make list

      - name: Doctor
        run: make doctor

      # v32sim does not build natively on Windows (UCRT64): it needs POSIX
      # termios, sockets and regex; its own release workflow builds it in
      # MSYS2's POSIX environment instead. Every other tool builds here.
      - name: Build (make front end)
        if: matrix.front == 'make'
        run: make build JOBS=2 ${{ runner.os == 'Windows' && 'SKIP=v32sim' || '' }}

      - name: Build (cmake front end)
        if: matrix.front == 'cmake'
        run: |
          cmake -S . -B build
          cmake --build build

      # The tools' own test suites, informational: several need the Vircon32
      # DevTools or each other's binaries and are not meant for every runner.
      - name: Test (informational)
        if: matrix.front == 'make' && runner.os == 'Linux'
        continue-on-error: true
        run: make test
